name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # checkout only

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # The $/ form zizmor asks for fails actionlint 1.7.12; this step runs right after the checkout.
      - uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: rust
          github-token: ${{ secrets.MISE_GITHUB_TOKEN }}
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Self-test
        run: cargo run --locked -- --self-test
